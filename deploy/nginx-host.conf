# ============================================================
# Ubuntu host nginx — serve admin + proxy API on PUBLIC IP / domain
# Install: sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/ndmf
#          sudo ln -sf /etc/nginx/sites-available/ndmf /etc/nginx/sites-enabled/
#          sudo rm -f /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name 13.60.224.155 ndclients.co.in www.ndclients.co.in _;

  # Prefer /var/www for nginx permissions (setup copies dist here)
  root /var/www/ndmf;
  index index.html;

  client_max_body_size 100M;

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
