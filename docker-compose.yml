services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    volumes:
      - ndfa-data:/app/data
      - ndfa-uploads:/app/uploads

  admin:
    build:
      context: .
      dockerfile: deploy/Dockerfile.admin
      args:
        VITE_API_BASE: /api/v1
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  ndfa-data:
  ndfa-uploads:
